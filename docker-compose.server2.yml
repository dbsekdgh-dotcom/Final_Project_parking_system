services:
  backend:
    image: ${ECR_REGISTRY}/parking-backend:latest
    container_name: parking-backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - AI_SERVER_URL=http://ai:8000
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST_SERVER2}
      - REDIS_PORT=6379
    depends_on:
      - ai
    restart: always
  ai:
    image: ${ECR_REGISTRY}/parking-ai:latest
    container_name: parking-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST_SERVER2}
      - REDIS_PORT=6379
      - TZ=Asia/Seoul
    restart: always