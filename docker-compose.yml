services:
  backend:
    image: 706877673423.dkr.ecr.ap-northeast-2.amazonaws.com/parking-backend:latest
    container_name: parking-backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    restart: always
    networks: [parking-net]

  ai:
    image: 706877673423.dkr.ecr.ap-northeast-2.amazonaws.com/parking-ai:latest
    container_name: parking-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    restart: always
    networks: [parking-net]

networks:
  parking-net:
    driver: bridge