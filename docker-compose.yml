services:
  mysql:
    image: mysql:8.0
    container_name: parking-mysql
    profiles:            
      - with-db           
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - parking-net

  backend:
    image: 706877673423.dkr.ecr.ap-northeast-2.amazonaws.com/parking-backend
    build:                          
      context: ./backend/parking_backend            
      dockerfile: Dockerfile        
    container_name: parking-backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - AI_SERVER_URL=http://ai:8000
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:         
      ai:
        condition: service_started
      redis:
        condition: service_started
    restart: always
    networks:
      - parking-net

  ai:
    image: 706877673423.dkr.ecr.ap-northeast-2.amazonaws.com/parking-ai
    build:                         
      context: ./ai-service       
      dockerfile: Dockerfile       
    container_name: parking-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    depends_on:
      - redis
    networks:
      - parking-net

  redis:
    image: redis:latest
    container_name: parking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - parking-net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  parking-net:
    driver: bridge