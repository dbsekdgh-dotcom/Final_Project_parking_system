services:
  redis:
    image: redis:7-alpine
    container_name: parking-redis
    ports:
      - "6379:6379"        # Server-02가 10.0.10.92:6379로 접속
    restart: always
    networks: [parking-net]
    profiles: ["with-db"]

  mysql:
    image: mysql:8.0
    container_name: parking-mysql
    ports:
      - "3306:3306"        # Server-02가 10.0.10.92:3306으로 접속
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=parking
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
    networks: [parking-net]
    profiles: ["with-db"]

  backend:
    depends_on:
      - redis
      - mysql

  ai:
    depends_on:
      - redis

volumes:
  mysql-data: