name: CI - Code Verification

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./backend/parking_backend/gradlew
        working-directory: .

      - name: Build without Tests
        run: ./gradlew build -x test
        working-directory: ./backend/parking_backend

      - name: Run Unit Tests
        run: ./gradlew test
        working-directory: ./backend/parking_backend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./backend/parking_backend/build/reports/tests/

  notify-success:
    name: Notify Success
    needs: [backend-test]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Build Success
        run: echo "All checks passed! Ready for Jenkins deployment."
