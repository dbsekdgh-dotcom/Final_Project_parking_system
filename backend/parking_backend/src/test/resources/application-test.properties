# ============================================
# CI 테스트용 설정 (더미값 - 실제 값 아님)
# ============================================

spring.application.name=parking_backend

# H2 인메모리 DB (MySQL 모드)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT 더미값
jwt.user.secret=test-user-secret-key-1234567890abcdef
jwt.admin.secret=test-admin-secret-key-1234567890abcdef
jwt.kiost.secret=test-store-secret-key-1234567890abcdef

# Redis 비활성화
spring.session.store-type=none
spring.data.redis.host=localhost
spring.data.redis.port=6379

# OAuth2 더미값
spring.security.oauth2.client.registration.kakao.client-id=test
spring.security.oauth2.client.registration.kakao.client-secret=test
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8081/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email,name,phone_number,birthday,birthyear

spring.security.oauth2.client.registration.naver.client-id=test
spring.security.oauth2.client.registration.naver.client-secret=test
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri=http://localhost:8081/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.scope=name,email,nickname,mobile

# Kakao Provider
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# Naver Provider
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# Mail 더미값
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@gmail.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000

# 기타 더미값
ai.server.url=http://localhost:8000
toss.secret.key=test
naver.clova.ocr.invoke-url=http://localhost:8000
naver.clova.ocr.secret-key=test

# 코드에서 dotted 프로퍼티가 아닌 raw 환경변수명으로 직접 주입받는 값들
AI_SERVER_URL=http://localhost:8000
USER_JWT_SECRET=test-user-secret-key-1234567890abcdef
TOSS_SECRET_KEY=test

# Frontend 더미값
frontend.user.url=http://localhost:5202
frontend.admin.url=http://localhost:5201
frontend.kiosk.url=http://localhost:5203

cookie.domain=
cookie.secure=false
server.port=8081

# Security 제외
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Seoul

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AWS 더미값
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.s3.bucket=test
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.stack.auto=false
