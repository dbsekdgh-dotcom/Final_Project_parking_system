spring.application.name=parking_backend

# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


spring.profiles.include=aws
spring.datasource.hikari.data-source-properties.zeroDateTimeBehavior=convertToNull
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# JPA
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
ai.server.url=${VITE_AI_SERVER_URL}
jwt.user.secret=${USER_JWT_SECRET}
jwt.admin.secret=${ADMIN_JWT_SECRET}
jwt.kiost.secret=${STORE_JWT_SECRET}
server.port=8081
server.forward-headers-strategy=native

frontend.user.url=${FRONTEND_USER_URL:http://localhost:5202}
frontend.admin.url=${FRONTEND_ADMIN_URL:http://localhost:5201}
frontend.kiosk.url=${FRONTEND_KIOSK_URL:http://localhost:5203}

cookie.domain=${COOKIE_DOMAIN:}
cookie.secure=${COOKIE_SECURE:false}

debug=true

logging.level.org.springframework.web.servlet.PageNotFount=DEBUG

# REDIS_HOST ??? ??? localhost? ??Redis?? / REDIS_HOST-> ??? AWS ??? ???? ??? ??
# ex. AWS ?? ???(?? ?? ??)? REDIS_HOST = aws-redis-url...??? ??, .env???? ?? ?? ??
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
# =========================================================
# OAuth2 Client Registration (Kakao & Naver)
# =========================================================

# 1. Kakao Registration
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8081/login/oauth2/code/kakao}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email,name,phone_number,birthday,birthyear


# 2. Naver Registration
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:8081/login/oauth2/code/naver}
spring.security.oauth2.client.registration.naver.scope=name,email,nickname,mobile

# =========================================================
# OAuth2 Providers Configuration
# =========================================================

# Kakao Provider
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id



# Naver Provider
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response


# Mail ?? (Gmail ??)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000

#tosspayments
toss.secret.key=${TOSS_SECRET_KEY}

naver.clova.ocr.invoke-url=${NAVER_OCR_INVOKE_URL}
naver.clova.ocr.secret-key=${NAVER_OCR_SECRET_KEY}

# ???? ???? ?? ??
# ???? ?? ??? ??? ????
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# 1. ???? ?? ?
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Seoul

# Actuator ???? ??
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
